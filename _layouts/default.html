<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script src="{{ '/assets/js/menu.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/links.js' | relative_url }}" defer></script>
</head>
<body>
  <header>
    <a class="titel" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <!-- Das Menü. Die Einträge stehen in _data/menu.yml -->
    <details class="menu">
      <summary aria-label="Menü">
        <span class="menu-zeichen" aria-hidden="true"></span>
      </summary>
      <nav aria-label="Menü">
        <ul>
          {% for eintrag in site.data.menu %}
          <li><a href="{{ eintrag.link | relative_url }}"{% if page.url == eintrag.link %} aria-current="page"{% endif %}>{{ eintrag.titel }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </details>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    <p>&copy; {{ 'now' | date: '%Y' }} {{ site.title }}</p>
  </footer>
</body>
</html>
